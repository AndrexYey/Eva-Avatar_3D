<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EVA — 3D Avatar Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- The avatar is the hero: a full-viewport 3D stage. -->
    <div id="stage" aria-label="EVA, 3D avatar"></div>
    <div id="loading">
      <div id="loading-label">Cargando avatar…</div>
    </div>

    <header id="topbar">
      <div id="identity">
        <h1>E.V.A</h1>
        <p>Entidad de Verificación Administrativa · GTC 185</p>
      </div>
      <div class="topbar-right">
        <span id="status-pill" class="pill idle" aria-live="polite">Ready</span>
      </div>
    </header>

    <!-- What she's saying, as it's spoken. -->
    <div id="user-line" aria-live="polite"></div>
    <div id="subtitles" aria-live="polite"></div>

    <footer id="controls">
      <div id="mic-container">
        <button id="mic-btn" disabled>
          <span id="mic-label">Listen</span>
        </button>
      </div>
      <form id="message-form">
        <input
          id="text-input"
          type="text"
          placeholder="Escribe un mensaje…"
          autocomplete="off"
          aria-label="Message"
        />
        <button id="send-btn" type="submit" class="primary" disabled>Send</button>
      </form>
    </footer>

    <!-- Gemini API key setup, pinned to the lower right corner. -->
    <aside id="key-panel" aria-label="Configuración de la clave de Gemini">
      <label for="api-key-input">Gemini API Key</label>
      <div class="key-row">
        <input
          id="api-key-input"
          type="password"
          placeholder="Pega tu clave aquí…"
          autocomplete="off"
          spellcheck="false"
          aria-describedby="key-status"
        />
        <button id="verify-key-btn" type="button" disabled>Verify</button>
      </div>
      <p id="key-status" role="status"></p>
    </aside>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
